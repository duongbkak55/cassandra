name: Publish HMA Docker Image to Docker Hub

on:
  push:
    branches:
      - hma-main
      - feature/hma-phase6-fast-cas
    tags:
      - 'v*-hma*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Docker Hub tag to publish'
        required: false
        default: 'latest'

env:
  DOCKERHUB_REPO: cassandra-hma

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Ant/Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            build/lib
          key: ${{ runner.os }}-ant-hma-${{ hashFiles('build.xml') }}
          restore-keys: |
            ${{ runner.os }}-ant-hma-

      - name: Build Cassandra HMA JAR
        run: ant _main-jar -Dno-checkstyle=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=v7.0.0-hma.1,enable=${{ github.ref == 'refs/heads/hma-main' || github.ref == 'refs/tags/v7.0.0-hma.1' }}
            type=raw,value=v7.0.0-hma.2,enable=${{ github.ref == 'refs/heads/feature/hma-phase6-fast-cas' || github.ref == 'refs/tags/v7.0.0-hma.2' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feature/hma-phase6-fast-cas' || github.ref == 'refs/tags/v7.0.0-hma.2' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub repository description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}
          short-description: "Apache Cassandra 7.0 HMA (Aerospike-Inspired Hybrid Memory Architecture & Fast-CAS Engine)"
          readme-filepath: ./doc/HMA_DOCKER_AND_CONFIG_GUIDE.md

